[project]
name = "flask-ujson"
version = "2.0.0"
description = "A Flask/Quart JSON provider using the fast ujson library."
readme = "README.md"
license = { file = "LICENSE.txt" }
maintainers = [{ name = "Pallets Community Ecosystem", email = "contact@palletsprojects.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Typing :: Typed"
]
requires-python = ">=3.8"
dependencies = [
    "flask",
    "ujson",
]

[dependency-groups]
build = [
    "build",
]
dev = [
    "pip-tools",
    "pre-commit",
    "ruff",
    "tox",
    "tox-uv",
    {include-group = "docs"},
    {include-group = "tests"},
    {include-group = "typing"},
]
docs = [
    "furo ; python_full_version >= '3.9'",
    "myst-parser ; python_full_version >= '3.9'",
    "sphinx ; python_full_version >= '3.9'",
]
gha-update = [
    "gha-update>=0.2.0 ; python_full_version >= '3.12'",
]
pre-commit = [
    "pre-commit ; python_full_version >= '3.9'",
    "pre-commit-uv ; python_full_version >= '3.9'",
]
tests = [
    "pytest",
]
typing = [
    "mypy",
    "pytest",
    "types-ujson",
]

[project.urls]
Documentation = "https://flask-ujson.readthedocs.io"
Changes = "https://flask-ujson.readthedocs.io/changes/"
Source = "https://github.com/pallets-eco/flask-ujson/"

[build-system]
requires = ["flit-core<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["flask_ujson", "tests"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.mypy]
files = ["src/flask_ujson", "tests"]
show_error_codes = true
pretty = true
strict = true

[tool.pyright]
include = ["src/flask_ujson", "tests"]

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
ignore-init-module-imports = true

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.tox]
envlist = [
    "py3.12",
    "py3.11",
    "py3.10",
    "py3.9",
    "py3.8",
    "style",
    "typing",
    "docs",
]

[tool.tox.env_run_base]
description = "pytest on latest dependency versions"
runner = "uv-venv-lock-runner"
package = "wheel"
wheel_build_env = ".pkg"
constrain_package_deps = true
use_frozen_constraints = true
dependency_groups = ["tests"]
env_tmp_dir = "{toxworkdir}/tmp/{envname}"
commands = [[
    "pytest", "-v", "--capture=tee-sys", "--tb=short", "--basetemp={env_tmp_dir}",
    {replace = "posargs", default = [], extend = true},
]]

[tool.tox.env.docs]
description = "build docs"
dependency_groups = ["docs"]
commands = [["sphinx-build", "-E", "-W", "-b", "html", "docs", "docs/_build/"]]

[tool.tox.env.style]
description = "run all pre-commit hooks on all files"
dependency_groups = ["pre-commit"]
skip_install = true
commands = [["pre-commit", "run", "--all-files"]]

[tool.tox.env.typing]
description = "run static type checkers"
dependency_groups = ["typing"]
commands = [
    ["mypy"],
]

[tool.tox.env.update-actions]
description = "update GitHub Actions pins"
labels = ["update"]
dependency_groups = ["gha-update"]
skip_install = true
commands = [["gha-update"]]

[tool.tox.env.update-pre-commit]
description = "update pre-commit pins"
labels = ["update"]
dependency_groups = ["pre-commit"]
skip_install = true
commands = [["pre-commit", "autoupdate", "--freeze", "-j4"]]

[tool.tox.env.update-requirements]
description = "update uv lock"
labels = ["update"]
dependency_groups = []
no_default_groups = true
skip_install = true
commands = [["uv", "lock", {replace = "posargs", default = ["-U"], extend = true}]]

[tool.uv]
default-groups = ["dev", "pre-commit", "tests", "typing"]
